services:
  redis:
    image: redis:7-alpine
    container_name: th79-imove-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - imove_redis_data:/data
volumes:
  imove_redis_data:
